name: CI/CD

on:
  push:
    branches:
      - "**" # run lint/test on every push to every branch
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  deploy-staging:
    name: Deploy to Staging
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build staging status page
        # Real deploy target for this assignment: Vercel, used here as the
        # "staging environment." Deploys a small static status page so the
        # pipeline is fully self-contained and verifiable with just one
        # secret (VERCEL_TOKEN). In a real production setup this step would
        # instead deploy the actual application build to the real staging
        # host, using the same secrets-handling approach described in
        # part3-cicd/README.md.
        run: |
          mkdir -p _site
          cat > _site/index.html << EOF
          <!DOCTYPE html>
          <html>
          <head><title>Staging - AI Agent Assignment</title></head>
          <body style="font-family: monospace; background:#0d1117; color:#c9d1d9; padding:2rem;">
            <h1>Staging deploy successful</h1>
            <p>Commit: ${{ github.sha }}</p>
            <p>Deployed at: $(date -u)</p>
            <p>Branch: ${{ github.ref_name }}</p>
          </body>
          </html>
          EOF

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel
          url=$(vercel deploy _site --prod --token="$VERCEL_TOKEN" --yes)
          echo "Deployed to: $url"
          echo "page_url=$url" >> "$GITHUB_OUTPUT"

      - name: Post-deploy smoke test
        run: |
          curl -f "${{ steps.deploy.outputs.page_url }}" || (echo "Smoke test failed" && exit 1)
