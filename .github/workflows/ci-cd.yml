name: CI/CD

on:
  push:
    branches:
      - "**" # run lint/test on every push to every branch
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  deploy-staging:
    name: Deploy to Staging
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy to staging
        env:
          # Pulled from the "staging" GitHub Environment's encrypted secrets,
          # never hardcoded, never logged. See part3-cicd/README.md for the
          # full secrets-handling explanation.
          DEPLOY_API_KEY: ${{ secrets.STAGING_DEPLOY_API_KEY }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          echo "Deploying build to $STAGING_HOST"
          # e.g.: ./scripts/deploy.sh --target staging --key "$DEPLOY_API_KEY"
          # Real deploy command goes here (Vercel CLI, rsync+ssh, Docker push, etc.)

      - name: Post-deploy smoke test
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          curl -f "https://$STAGING_HOST/healthz" || (echo "Smoke test failed" && exit 1)
